<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickComparer — Phase 0 技術驗證</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1c1f26;
        --panel-2: #232732;
        --line: #333846;
        --text: #e4e7ee;
        --dim: #949bad;
        --accent: #5aa9ff;
        --ok: #4ec98a;
        --warn: #e8b84b;
        --bad: #e8695f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 320px;
        overflow: hidden;
      }

      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      #stage {
        flex: 1;
        position: relative;
        background: #0c0d10;
        min-height: 0;
      }

      #canvas { width: 100%; height: 100%; display: block; }

      #dropHint {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        pointer-events: none;
        color: var(--dim);
        text-align: center;
        padding: 24px;
      }
      #dropHint.hidden { display: none; }
      #dropHint strong { color: var(--text); font-size: 15px; }
      #dropHint code {
        background: var(--panel-2);
        padding: 1px 5px;
        border-radius: 3px;
        color: var(--accent);
      }

      body.dragging #stage { outline: 2px dashed var(--accent); outline-offset: -8px; }

      #transport {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      #scrub { flex: 1; min-width: 180px; }
      #timeLabel { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 120px; }

      aside {
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 14px;
      }

      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 18px 0 8px;
        font-weight: 600;
      }
      h2:first-child { margin-top: 0; }

      .row {
        display: grid;
        grid-template-columns: 88px 1fr;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .row > label { color: var(--dim); font-size: 12px; }

      select, input[type="range"], button {
        width: 100%;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 6px;
        font: inherit;
      }
      input[type="range"] { padding: 0; }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }

      .btn-row { display: flex; gap: 6px; margin-bottom: 6px; }

      table.stats {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      table.stats td {
        padding: 2px 0;
        border-bottom: 1px solid #262a34;
      }
      table.stats td:first-child { color: var(--dim); }
      table.stats td:last-child { text-align: right; }

      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }

      #log {
        font-family: Consolas, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        color: var(--dim);
        max-height: 220px;
        overflow-y: auto;
        background: #16181e;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        color: var(--dim);
        font-size: 12px;
      }
      .checkbox-row input { width: auto; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="dropHint">
          <strong>把兩個檔案拖進來</strong>
          <div>先拖的是 A，後拖的是 B。支援 mp4 與圖片。</div>
          <div>
            空白鍵播放／暫停　<code>←</code> <code>→</code> 逐幀　<code>S</code> 切換 A/B
          </div>
          <div>分割線可直接在畫面上拖曳，<code>Alt</code> + 拖曳為旋轉</div>
        </div>
      </div>

      <div id="transport">
        <button id="playBtn" style="width: auto; padding: 4px 14px" disabled>播放</button>
        <button id="stepBack" style="width: auto; padding: 4px 10px" disabled>◀</button>
        <button id="stepFwd" style="width: auto; padding: 4px 10px" disabled>▶</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" disabled />
        <span id="timeLabel">— / —</span>
      </div>
    </main>

    <aside>
      <h2>來源</h2>
      <table class="stats">
        <tbody id="sourceInfo">
          <tr><td colspan="2" style="text-align: center; color: var(--dim)">尚未載入</td></tr>
        </tbody>
      </table>

      <h2>比對</h2>
      <div class="row">
        <label for="layout">佈局</label>
        <select id="layout">
          <option value="single">Single</option>
          <option value="horizontal">左右</option>
          <option value="vertical">上下</option>
          <option value="grid">Grid</option>
        </select>
      </div>
      <div class="row">
        <label for="compareMode">模式</label>
        <select id="compareMode">
          <option value="slider">Slider</option>
          <option value="single">Switch</option>
          <option value="diff">Diff</option>
        </select>
      </div>
      <div class="row">
        <label for="splitPos">分割位置</label>
        <input type="range" id="splitPos" min="0" max="1" step="0.001" value="0.5" />
      </div>
      <div class="row">
        <label for="splitAngle">分割角度</label>
        <input type="range" id="splitAngle" min="-90" max="90" step="1" value="0" />
      </div>
      <div class="row">
        <label for="diffGain">Diff 倍率</label>
        <input type="range" id="diffGain" min="1" max="32" step="1" value="1" />
      </div>

      <h2>檢視</h2>
      <div class="row">
        <label for="interp">插值</label>
        <select id="interp">
          <option value="nearest">Nearest（預設）</option>
          <option value="bilinear">Bilinear</option>
          <option value="bicubic">Bicubic</option>
        </select>
      </div>
      <div class="row">
        <label for="zoom">Zoom</label>
        <input type="range" id="zoom" min="1" max="800" step="1" value="100" />
      </div>
      <div style="color: var(--dim); font-size: 11px; margin-bottom: 6px">
        畫面上滾輪縮放、拖曳平移，A/B 同步。<br />
        拖分割線本身可移動它，按住 <code>Alt</code> 拖則是旋轉。
      </div>
      <button id="resetView">重設檢視</button>

      <h2>色彩</h2>
      <div class="row">
        <label for="outputTf">輸出</label>
        <select id="outputTf">
          <option value="srgb">sRGB</option>
          <option value="bt709">BT.709</option>
          <option value="linear">Linear（除錯）</option>
        </select>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="toneMap" />
        <label for="toneMap">ACES 近似 tone map</label>
      </div>

      <h2>量測</h2>
      <table class="stats">
        <tbody id="perfStats"></tbody>
      </table>

      <h2>驗證</h2>
      <div class="btn-row">
        <button id="seekTest" disabled>Seek 測試</button>
        <button id="passthroughTest" disabled>色彩來回</button>
      </div>
      <div class="btn-row">
        <button id="benchBtn" disabled>吞吐量 benchmark</button>
      </div>
      <div class="btn-row">
        <button id="probeBtn" disabled>並行解碼上限</button>
      </div>
      <div class="btn-row">
        <button id="exportBtn">匯出量測 JSON</button>
      </div>

      <h2>紀錄</h2>
      <div id="log"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
